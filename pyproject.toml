[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa_automator"
version = "0.1.0"
description = "Biblioteca para automação de testes baseada em agentes"
readme = "README.md"
authors = [
    {name = "JRSMoura", email = "jtsr@gft.com.br"}
]
maintainers = [
    {name = "JRSMoura", email = "jtsr@gft.com.br"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["GOOGLE-ADK", "Automation", "Tests", "QA", "Testing", "Agents", "AI"]
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.16.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/jrsmoura/qa_automator"
Documentation = "https://github.com/jrsmoura/qa_automator/blob/main/README.md"
Repository = "https://github.com/jrsmoura/qa_automator"
"Bug Tracker" = "https://github.com/jrsmoura/qa_automator/issues"

[project.scripts]
qa-automator = "qa_automator.main:main"

[tool.setuptools]
packages = ["qa_automator", "qa_automator.cli", "qa_automator.templates", "qa_automator.templates.base", "qa_automator.templates.subagents"]

[tool.setuptools.package-data]
qa_automator = ["templates/**/*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
